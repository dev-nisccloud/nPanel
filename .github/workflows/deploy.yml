name: Deployment Pipeline

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

env:
  BUN_VERSION: 'latest'
  # GCP Config (staging defaults)
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  ARTIFACT_REGION: ${{ secrets.GCP_ARTIFACT_REGION }}
  REPO_NAME: ${{ secrets.GCP_ARTIFACT_REPO }}

jobs:
  # Quality checks and type checking
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check-types

  # Build verification (ensure everything compiles)
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        # Using turbo to build the monorepo
        run: NODE_OPTIONS="--max-old-space-size=8192" bun run build

  # Run Drizzle migrations for staging
  migrate-staging:
    name: Migrate Database (Staging)
    runs-on: ubuntu-latest
    needs: [quality-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING || secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ DATABASE_URL is empty. Set the DATABASE_URL_STAGING (or DATABASE_URL) secret in your GitHub repository/environment settings."
            exit 1
          fi
          cd packages/db
          bun run db:migrate
          echo "✅ Staging database migrations completed"

  # 1. Deploy npanel-server to Google Cloud Run (Staging)
  deploy-server-staging:
    name: Deploy Staging Server to Cloud Run
    runs-on: ubuntu-latest
    needs: [build-check, migrate-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      SERVICE_NAME: npanel-server-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGION }}-docker.pkg.dev

      - name: Build and Push Server Container
        run: |
          docker build -f apps/server/Dockerfile \
            -t ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            .
          docker push ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy Server to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated --memory 4Gi --cpu-boost --concurrency 40 --max-instances 8 --min-instances 1'
          env_vars: |
            NODE_ENV=production
            DATABASE_URL=${{ secrets.DATABASE_URL_STAGING || secrets.DATABASE_URL }}
            DATABASE_POOLER_URL=${{ secrets.DATABASE_POOLER_URL_STAGING || secrets.DATABASE_POOLER_URL }}
            DB_POOL_MAX=12
            UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
            UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
            HOSTNAME=0.0.0.0
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL_STAGING }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            VITE_PUBLIC_APP_URL=${{ secrets.VITE_PUBLIC_APP_URL_STAGING }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            DIGITAX_API_KEY=${{ secrets.DIGITAX_API_KEY }}
            DIGITAX_API_URL=${{ secrets.DIGITAX_API_URL || 'https://api.digitax.tech/ke/v2' }}
            QSTASH_TOKEN=${{ secrets.QSTASH_TOKEN_STAGING || secrets.QSTASH_TOKEN }}
            QSTASH_CURRENT_SIGNING_KEY=${{ secrets.QSTASH_CURRENT_SIGNING_KEY_STAGING || secrets.QSTASH_CURRENT_SIGNING_KEY }}
            QSTASH_VITE_SIGNING_KEY=${{ secrets.QSTASH_VITE_SIGNING_KEY_STAGING || secrets.QSTASH_VITE_SIGNING_KEY }}
            QSTASH_URL=${{ secrets.QSTASH_URL || 'https://qstash.upstash.io' }}
            DISABLE_WORKER_ROUTES=${{ secrets.DISABLE_WORKER_ROUTES_STAGING }}
            QSTASH_CAMPAIGN_WORKER_ENDPOINT=${{ secrets.QSTASH_CAMPAIGN_WORKER_ENDPOINT_STAGING }}
            QSTASH_NISC_ORDER_WORKER_ENDPOINT=${{ secrets.QSTASH_NISC_ORDER_WORKER_ENDPOINT_STAGING }}
            QSTASH_IMAGE_GENERATOR_WORKER_ENDPOINT=${{ secrets.QSTASH_IMAGE_GENERATOR_WORKER_ENDPOINT_STAGING }}
            QSTASH_BACKGROUND_REMOVER_WORKER_ENDPOINT=${{ secrets.QSTASH_BACKGROUND_REMOVER_WORKER_ENDPOINT_STAGING }}
            QSTASH_NISC_EM_DISPATCH_WORKER_ENDPOINT=${{ secrets.QSTASH_NISC_EM_DISPATCH_WORKER_ENDPOINT_STAGING }}
            QSTASH_WORKER_ENDPOINT=${{ secrets.QSTASH_WORKER_ENDPOINT_STAGING }}
            QSTASH_LINKEDIN_WORKER_ENDPOINT=${{ secrets.QSTASH_LINKEDIN_WORKER_ENDPOINT_STAGING }}
            QSTASH_ZEEPO_CANVAS_WORKER_ENDPOINT=${{ secrets.QSTASH_ZEEPO_CANVAS_WORKER_ENDPOINT_STAGING }}
            REPLICATE_ZEEPO_CANVAS_WEBHOOK_URL=${{ secrets.REPLICATE_ZEEPO_CANVAS_WEBHOOK_URL_STAGING }}
            REPLICATE_API_TOKEN=${{ secrets.REPLICATE_API_TOKEN }}
            QSTASH_EMAIL_BUILDER_AI_WORKER_ENDPOINT=${{ secrets.QSTASH_EMAIL_BUILDER_AI_WORKER_ENDPOINT_STAGING }}
            REPLICATE_EMAIL_BUILDER_AI_WEBHOOK_URL=${{ secrets.REPLICATE_EMAIL_BUILDER_AI_WEBHOOK_URL_STAGING }}
            QSTASH_META_ADS_ANALYSIS_WORKER_ENDPOINT=${{ secrets.QSTASH_META_ADS_ANALYSIS_WORKER_ENDPOINT_STAGING }}
            REPLICATE_META_ADS_ANALYSIS_WEBHOOK_URL=${{ secrets.REPLICATE_META_ADS_ANALYSIS_WEBHOOK_URL_STAGING }}
            QSTASH_ZEEPO_AGENT_WORKER_ENDPOINT=${{ secrets.QSTASH_ZEEPO_AGENT_WORKER_ENDPOINT_STAGING }}
            REPLICATE_ZEEPO_AGENT_WEBHOOK_URL=${{ secrets.REPLICATE_ZEEPO_AGENT_WEBHOOK_URL_STAGING }}
            REPLICATE_IMAGE_GENERATOR_WEBHOOK_URL=${{ secrets.REPLICATE_IMAGE_GENERATOR_WEBHOOK_URL_STAGING }}
            BRAVE_SEARCH_API_KEY=${{ secrets.BRAVE_SEARCH_API_KEY }}
            QSTASH_NISC_EMAIL_BUILDER_WORKER_ENDPOINT=${{ secrets.QSTASH_NISC_EMAIL_BUILDER_WORKER_ENDPOINT_STAGING }}

      - name: Health check
        continue-on-error: true
        run: |
          max_attempts=45
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            # Assumes health endpoint exists, adjust as needed
            if curl -f -s -o /dev/null "${{ steps.deploy.outputs.url }}/api/health"; then
              echo "✅ Cloud Run server deployment successful and healthy! URL: ${{ steps.deploy.outputs.url }}"
              exit 0
            fi
            echo "⏳ Waiting for deployment... ($((attempt + 1))/$max_attempts)"
            sleep 10
            attempt=$((attempt + 1))
          done
          echo "⚠️ Server deployment health check timed out after $max_attempts attempts, but proceeding to next step..."

  deploy-workers-staging:
    name: Deploy Staging Workers to Cloud Run
    runs-on: ubuntu-latest
    needs: [deploy-server-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      SERVICE_NAME: npanel-workers-staging
      SERVER_SERVICE_NAME: npanel-server-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Workers to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVER_SERVICE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated --memory 4Gi --cpu-boost --concurrency 20 --max-instances 4 --min-instances 0 --command bun --args src/workers-index.ts'
          env_vars: |
            NODE_ENV=production
            NPANEL_SERVICE_ROLE=workers
            DATABASE_URL=${{ secrets.DATABASE_URL_STAGING || secrets.DATABASE_URL }}
            DATABASE_POOLER_URL=${{ secrets.DATABASE_POOLER_URL_STAGING || secrets.DATABASE_POOLER_URL }}
            DB_POOL_MAX=20
            UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
            UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
            HOSTNAME=0.0.0.0
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL_STAGING }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            VITE_PUBLIC_APP_URL=${{ secrets.VITE_PUBLIC_APP_URL_STAGING }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            DIGITAX_API_KEY=${{ secrets.DIGITAX_API_KEY }}
            DIGITAX_API_URL=${{ secrets.DIGITAX_API_URL || 'https://api.digitax.tech/ke/v2' }}
            QSTASH_TOKEN=${{ secrets.QSTASH_TOKEN_STAGING || secrets.QSTASH_TOKEN }}
            QSTASH_CURRENT_SIGNING_KEY=${{ secrets.QSTASH_CURRENT_SIGNING_KEY_STAGING || secrets.QSTASH_CURRENT_SIGNING_KEY }}
            QSTASH_VITE_SIGNING_KEY=${{ secrets.QSTASH_VITE_SIGNING_KEY_STAGING || secrets.QSTASH_VITE_SIGNING_KEY }}
            QSTASH_URL=${{ secrets.QSTASH_URL || 'https://qstash.upstash.io' }}
            QSTASH_CAMPAIGN_WORKER_ENDPOINT=${{ secrets.QSTASH_CAMPAIGN_WORKER_ENDPOINT_STAGING }}
            QSTASH_NISC_ORDER_WORKER_ENDPOINT=${{ secrets.QSTASH_NISC_ORDER_WORKER_ENDPOINT_STAGING }}
            QSTASH_IMAGE_GENERATOR_WORKER_ENDPOINT=${{ secrets.QSTASH_IMAGE_GENERATOR_WORKER_ENDPOINT_STAGING }}
            QSTASH_BACKGROUND_REMOVER_WORKER_ENDPOINT=${{ secrets.QSTASH_BACKGROUND_REMOVER_WORKER_ENDPOINT_STAGING }}
            QSTASH_NISC_EM_DISPATCH_WORKER_ENDPOINT=${{ secrets.QSTASH_NISC_EM_DISPATCH_WORKER_ENDPOINT_STAGING }}
            QSTASH_WORKER_ENDPOINT=${{ secrets.QSTASH_WORKER_ENDPOINT_STAGING }}
            QSTASH_LINKEDIN_WORKER_ENDPOINT=${{ secrets.QSTASH_LINKEDIN_WORKER_ENDPOINT_STAGING }}
            QSTASH_ZEEPO_CANVAS_WORKER_ENDPOINT=${{ secrets.QSTASH_ZEEPO_CANVAS_WORKER_ENDPOINT_STAGING }}
            REPLICATE_ZEEPO_CANVAS_WEBHOOK_URL=${{ secrets.REPLICATE_ZEEPO_CANVAS_WEBHOOK_URL_STAGING }}
            REPLICATE_API_TOKEN=${{ secrets.REPLICATE_API_TOKEN }}
            QSTASH_EMAIL_BUILDER_AI_WORKER_ENDPOINT=${{ secrets.QSTASH_EMAIL_BUILDER_AI_WORKER_ENDPOINT_STAGING }}
            REPLICATE_EMAIL_BUILDER_AI_WEBHOOK_URL=${{ secrets.REPLICATE_EMAIL_BUILDER_AI_WEBHOOK_URL_STAGING }}
            QSTASH_META_ADS_ANALYSIS_WORKER_ENDPOINT=${{ secrets.QSTASH_META_ADS_ANALYSIS_WORKER_ENDPOINT_STAGING }}
            REPLICATE_META_ADS_ANALYSIS_WEBHOOK_URL=${{ secrets.REPLICATE_META_ADS_ANALYSIS_WEBHOOK_URL_STAGING }}
            QSTASH_ZEEPO_AGENT_WORKER_ENDPOINT=${{ secrets.QSTASH_ZEEPO_AGENT_WORKER_ENDPOINT_STAGING }}
            REPLICATE_ZEEPO_AGENT_WEBHOOK_URL=${{ secrets.REPLICATE_ZEEPO_AGENT_WEBHOOK_URL_STAGING }}
            REPLICATE_IMAGE_GENERATOR_WEBHOOK_URL=${{ secrets.REPLICATE_IMAGE_GENERATOR_WEBHOOK_URL_STAGING }}
            BRAVE_SEARCH_API_KEY=${{ secrets.BRAVE_SEARCH_API_KEY }}
            QSTASH_NISC_EMAIL_BUILDER_WORKER_ENDPOINT=${{ secrets.QSTASH_NISC_EMAIL_BUILDER_WORKER_ENDPOINT_STAGING }}
            AWS_SES_REGION=${{ secrets.AWS_SES_REGION }}
            AWS_SES_ACCESS_KEY_ID=${{ secrets.AWS_SES_ACCESS_KEY_ID }}
            AWS_SES_SECRET_ACCESS_KEY=${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
            SES_CONFIGURATION_SET=${{ secrets.SES_CONFIGURATION_SET }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}

      - name: Workers URL handoff
        run: |
          echo "✅ Workers service URL: ${{ steps.deploy.outputs.url }}"
          echo "Set GitHub secrets QSTASH_*_WORKER_ENDPOINT_STAGING to this host + /api/workers/... paths."
          echo "Then set DISABLE_WORKER_ROUTES_STAGING=1 on the API server when QStash jobs are verified."

  # 2. Deploy npanel-web to Google Cloud Run (Staging)
  deploy-web-staging:
    name: Deploy Staging Web to Cloud Run
    runs-on: ubuntu-latest
    needs: [deploy-server-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      SERVICE_NAME: npanel-web-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGION }}-docker.pkg.dev

      - name: Resolve server URL (staging)
        id: resolve-server-url
        run: |
          SERVER_URL="$(gcloud run services describe npanel-server-staging --region "${{ env.REGION }}" --format='value(status.url)')"
          if [ -z "$SERVER_URL" ]; then
            echo "❌ Could not resolve server URL for npanel-server-staging"
            exit 1
          fi
          echo "server_url=$SERVER_URL" >> "$GITHUB_OUTPUT"
          echo "✅ Resolved server URL: $SERVER_URL"

      - name: Validate server URL handoff (staging)
        run: |
          SERVER_URL="${{ steps.resolve-server-url.outputs.server_url }}"
          if [ -z "$SERVER_URL" ]; then
            echo "❌ Missing resolved server URL in staging web job"
            exit 1
          fi
          case "$SERVER_URL" in
            https://*) ;;
            *)
              echo "❌ server_url is not https: $SERVER_URL"
              exit 1
              ;;
          esac
          if ! curl -f -s -o /dev/null "$SERVER_URL/api/health"; then
            echo "❌ Server health check failed before web build: $SERVER_URL/api/health"
            exit 1
          fi
          echo "✅ Using server URL for web build: $SERVER_URL"

      - name: Build and Push Web Container
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg VITE_SERVER_URL=${{ steps.resolve-server-url.outputs.server_url }} \
            --build-arg BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET || 'build-time-placeholder-do-not-use-in-production' }} \
            -t ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            .
          docker push ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy Web to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated --min-instances=1'
          env_vars: |
            NODE_ENV=production
            HOSTNAME=0.0.0.0
            VITE_SERVER_URL=${{ steps.resolve-server-url.outputs.server_url }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}

  # Production - runs on push/merge to the production branch (same flow as main → staging)
  migrate-production:
    name: Migrate Database (Production)
    runs-on: ubuntu-latest
    needs: [quality-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ DATABASE_URL is empty. Set DATABASE_URL_PRODUCTION on the GitHub **production** environment (Settings → Environments → production → Environment secrets)."
            exit 1
          fi
          cd packages/db
          bun run db:migrate
          echo "✅ Production database migrations completed"

  deploy-server-production:
    name: Deploy Server to Production
    runs-on: ubuntu-latest
    needs: [build-check, migrate-production]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    environment:
      name: production
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      SERVICE_NAME: npanel-server-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGION }}-docker.pkg.dev

      - name: Build and Push Server Container
        run: |
          docker build -f apps/server/Dockerfile \
            -t ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            .
          docker push ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy Server to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated --memory 2Gi --cpu-boost --concurrency 40 --max-instances 8 --min-instances 1'
          env_vars: |
            NODE_ENV=production
            DATABASE_URL=${{ secrets.DATABASE_URL_PRODUCTION }}
            DATABASE_POOLER_URL=${{ secrets.DATABASE_POOLER_URL_PRODUCTION || secrets.DATABASE_POOLER_URL }}
            DB_POOL_MAX=12
            UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
            UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
            HOSTNAME=0.0.0.0
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET_PRODUCTION }}
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL_PRODUCTION }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN_PRODUCTION }}
            VITE_PUBLIC_APP_URL=${{ secrets.VITE_PUBLIC_APP_URL_PRODUCTION }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            DIGITAX_API_KEY=${{ secrets.DIGITAX_API_KEY }}
            DIGITAX_API_URL=${{ secrets.DIGITAX_API_URL || 'https://api.digitax.tech/ke/v2' }}
            QSTASH_TOKEN=${{ secrets.QSTASH_TOKEN_PRODUCTION || secrets.QSTASH_TOKEN }}
            QSTASH_CURRENT_SIGNING_KEY=${{ secrets.QSTASH_CURRENT_SIGNING_KEY_PRODUCTION || secrets.QSTASH_CURRENT_SIGNING_KEY }}
            QSTASH_VITE_SIGNING_KEY=${{ secrets.QSTASH_VITE_SIGNING_KEY_PRODUCTION || secrets.QSTASH_VITE_SIGNING_KEY }}
            QSTASH_URL=${{ secrets.QSTASH_URL || 'https://qstash.upstash.io' }}
            DISABLE_WORKER_ROUTES=${{ secrets.DISABLE_WORKER_ROUTES_PRODUCTION }}
            QSTASH_CAMPAIGN_WORKER_ENDPOINT=${{ secrets.QSTASH_CAMPAIGN_WORKER_ENDPOINT_PRODUCTION }}
            QSTASH_NISC_ORDER_WORKER_ENDPOINT=${{ secrets.QSTASH_NISC_ORDER_WORKER_ENDPOINT_PRODUCTION }}
            QSTASH_IMAGE_GENERATOR_WORKER_ENDPOINT=${{ secrets.QSTASH_IMAGE_GENERATOR_WORKER_ENDPOINT_PRODUCTION }}
            QSTASH_BACKGROUND_REMOVER_WORKER_ENDPOINT=${{ secrets.QSTASH_BACKGROUND_REMOVER_WORKER_ENDPOINT_PRODUCTION }}
            QSTASH_NISC_EM_DISPATCH_WORKER_ENDPOINT=${{ secrets.QSTASH_NISC_EM_DISPATCH_WORKER_ENDPOINT_PRODUCTION }}
            QSTASH_WORKER_ENDPOINT=${{ secrets.QSTASH_WORKER_ENDPOINT_PRODUCTION }}
            QSTASH_LINKEDIN_WORKER_ENDPOINT=${{ secrets.QSTASH_LINKEDIN_WORKER_ENDPOINT_PRODUCTION }}
            QSTASH_ZEEPO_CANVAS_WORKER_ENDPOINT=${{ secrets.QSTASH_ZEEPO_CANVAS_WORKER_ENDPOINT_PRODUCTION }}
            REPLICATE_ZEEPO_CANVAS_WEBHOOK_URL=${{ secrets.REPLICATE_ZEEPO_CANVAS_WEBHOOK_URL_PRODUCTION }}
            REPLICATE_API_TOKEN=${{ secrets.REPLICATE_API_TOKEN }}
            QSTASH_EMAIL_BUILDER_AI_WORKER_ENDPOINT=${{ secrets.QSTASH_EMAIL_BUILDER_AI_WORKER_ENDPOINT_PRODUCTION }}
            REPLICATE_EMAIL_BUILDER_AI_WEBHOOK_URL=${{ secrets.REPLICATE_EMAIL_BUILDER_AI_WEBHOOK_URL_PRODUCTION }}
            QSTASH_META_ADS_ANALYSIS_WORKER_ENDPOINT=${{ secrets.QSTASH_META_ADS_ANALYSIS_WORKER_ENDPOINT_PRODUCTION }}
            REPLICATE_META_ADS_ANALYSIS_WEBHOOK_URL=${{ secrets.REPLICATE_META_ADS_ANALYSIS_WEBHOOK_URL_PRODUCTION }}
            QSTASH_ZEEPO_AGENT_WORKER_ENDPOINT=${{ secrets.QSTASH_ZEEPO_AGENT_WORKER_ENDPOINT_PRODUCTION }}
            REPLICATE_ZEEPO_AGENT_WEBHOOK_URL=${{ secrets.REPLICATE_ZEEPO_AGENT_WEBHOOK_URL_PRODUCTION }}
            REPLICATE_IMAGE_GENERATOR_WEBHOOK_URL=${{ secrets.REPLICATE_IMAGE_GENERATOR_WEBHOOK_URL_PRODUCTION }}
            BRAVE_SEARCH_API_KEY=${{ secrets.BRAVE_SEARCH_API_KEY }}
            QSTASH_NISC_EMAIL_BUILDER_WORKER_ENDPOINT=${{ secrets.QSTASH_NISC_EMAIL_BUILDER_WORKER_ENDPOINT_PRODUCTION }}

      - name: Health check
        continue-on-error: true
        run: |
          max_attempts=45
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f -s -o /dev/null "${{ steps.deploy.outputs.url }}/api/health"; then
              echo "✅ Cloud Run server deployment successful and healthy! URL: ${{ steps.deploy.outputs.url }}"
              exit 0
            fi
            echo "⏳ Waiting for deployment... ($((attempt + 1))/$max_attempts)"
            sleep 10
            attempt=$((attempt + 1))
          done
          echo "⚠️ Server deployment health check timed out after $max_attempts attempts, but proceeding to next step..."

  deploy-workers-production:
