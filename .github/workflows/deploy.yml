    runs-on: ubuntu-latest
    needs: [deploy-server-production]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    environment:
      name: production
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      SERVICE_NAME: npanel-workers-production
      SERVER_SERVICE_NAME: npanel-server-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

