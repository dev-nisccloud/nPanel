name: Deploy to Render

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
      - production

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.16.1'

jobs:
  # Quality checks and type checking
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    env:
      PRISMA_BINARY_TARGETS: ${{ secrets.PRISMA_BINARY_TARGETS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_STAGING }}
          PRISMA_BINARY_TARGETS: ${{ secrets.PRISMA_BINARY_TARGETS }}
        run: pnpm -C packages/db exec prisma generate

      - name: Type check
        run: pnpm run check-types

  # Validate Prisma schema
  prisma-check:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest
    env:
      PRISMA_BINARY_TARGETS: ${{ secrets.PRISMA_BINARY_TARGETS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_STAGING }}
        run: |
          cd packages/db
          pnpm exec prisma format --check
          pnpm exec prisma validate

      - name: Check for pending migrations (PR only)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_STAGING }}
        run: |
          cd packages/db
          pnpm exec prisma migrate diff \
            --from-schema-datamodel prisma/schema \
            --to-schema-datasource ${{ secrets.DATABASE_URL_STAGING }} \
            --exit-code

  # Build verification (ensure everything compiles)
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: quality-checks
    env:
      PRISMA_BINARY_TARGETS: ${{ secrets.PRISMA_BINARY_TARGETS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_STAGING }}
          PRISMA_BINARY_TARGETS: ${{ secrets.PRISMA_BINARY_TARGETS }}
        run: pnpm -C packages/db exec prisma generate

      - name: Build all packages
        run: NODE_OPTIONS="--max-old-space-size=6144" pnpm run build

  # Run database migrations for staging
  migrate-staging:
    name: Migrate Database (Staging)
    runs-on: ubuntu-latest
    needs: [quality-checks, prisma-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
    env:
      PRISMA_BINARY_TARGETS: ${{ secrets.PRISMA_BINARY_TARGETS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_STAGING }}
          PRISMA_BINARY_TARGETS: ${{ secrets.PRISMA_BINARY_TARGETS }}
        run: |
          cd packages/db
          pnpm exec prisma migrate deploy
          echo "✅ Staging database migrations completed"

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-check, migrate-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
    steps:
      - name: Trigger Render Deploy
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}")
          http_code=$(echo "$response" | tail -n 1)
          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 201 ]; then
            echo "✅ Deployment triggered successfully"
          else
            echo "❌ Deployment trigger failed with code: $http_code"
            exit 1
          fi

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for Render to build and deploy..."
          sleep 90

      - name: Health check
        run: |
          max_attempts=50
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f -s -o /dev/null "${{ secrets.STAGING_URL }}/api/health"; then
              echo "✅ Staging deployment successful and healthy!"
              exit 0
            fi
            echo "⏳ Waiting for deployment... ($((attempt + 1))/$max_attempts)"
            sleep 10
            attempt=$((attempt + 1))
          done
          echo "❌ Deployment health check failed after $max_attempts attempts"
          exit 1

      - name: Smoke tests
        run: |
          echo "Running smoke tests..."
          
          # Test homepage
          if ! curl -f -s -o /dev/null "${{ secrets.STAGING_URL }}"; then
            echo "❌ Homepage test failed"
            exit 1
          fi
          
          echo "✅ All smoke tests passed"

  # Run database migrations for production
  migrate-production:
    name: Migrate Database (Production)
    runs-on: ubuntu-latest
    needs: [quality-checks, prisma-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    environment:
      name: production
    env:
      PRISMA_BINARY_TARGETS: ${{ secrets.PRISMA_BINARY_TARGETS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backup notification
        run: |
          echo "🔔 Running production migrations - ensure database backup exists!"

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_PRODUCTION }}
          PRISMA_BINARY_TARGETS: ${{ secrets.PRISMA_BINARY_TARGETS }}
        run: |
          cd packages/db
          pnpm exec prisma migrate deploy
          echo "✅ Production database migrations completed"

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-check, migrate-production]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}")
          http_code=$(echo "$response" | tail -n 1)
          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 201 ]; then
            echo "✅ Production deployment triggered successfully"
          else
            echo "❌ Deployment trigger failed with code: $http_code"
            exit 1
          fi

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for Render to build and deploy to production..."
          sleep 120

      - name: Health check
        run: |
          max_attempts=40
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f -s -o /dev/null "${{ secrets.PRODUCTION_URL }}/api/health"; then
              echo "✅ Production deployment successful and healthy!"
              exit 0
            fi
            echo "⏳ Waiting for deployment... ($((attempt + 1))/$max_attempts)"
            sleep 10
            attempt=$((attempt + 1))
          done
          echo "❌ Production deployment health check failed"
          exit 1

      - name: Create release tag
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          TAG_NAME="release-$(date +'%Y%m%d-%H%M%S')"
          git tag -a "$TAG_NAME" -m "Production release $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Production smoke tests
        run: |
          echo "Running production smoke tests..."
          
          # Test homepage
          if ! curl -f -s -o /dev/null "${{ secrets.PRODUCTION_URL }}"; then
            echo "❌ Homepage test failed"
            exit 1
          fi
          
          # Test API health
          if ! curl -f -s "${{ secrets.PRODUCTION_URL }}/api/health"; then
            echo "❌ API health test failed"
            exit 1
          fi
          
          echo "✅ All production smoke tests passed"
