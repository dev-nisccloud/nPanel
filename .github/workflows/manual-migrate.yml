name: Manual Database Migration

# This workflow allows you to manually run database migrations
# Use this for emergency fixes or when you need to run migrations without deploying

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to migrate'
        required: true
        type: choice
        options:
          - staging
          - production
      confirm:
        description: 'Type "yes" to confirm migration'
        required: true
        type: string

env:
  PNPM_VERSION: '10.16.1'
  NODE_VERSION: '20'

jobs:
  migrate:
    name: Run Database Migration
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes" ]; then
            echo "❌ Migration cancelled - confirmation not provided"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set database URL
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "DATABASE_URL=${{ secrets.DATABASE_URL_PRODUCTION }}" >> $GITHUB_ENV
            echo "DIRECT_URL=${{ secrets.DIRECT_URL_PRODUCTION }}" >> $GITHUB_ENV
          else
            echo "DATABASE_URL=${{ secrets.DATABASE_URL_STAGING }}" >> $GITHUB_ENV
            echo "DIRECT_URL=${{ secrets.DIRECT_URL_STAGING }}" >> $GITHUB_ENV
          fi

      - name: Check migration status (before)
        run: |
          cd packages/db
          echo "📊 Current migration status:"
          pnpm exec prisma migrate status || true

      - name: Run migrations
        run: |
          cd packages/db
          echo "🔄 Running migrations on ${{ github.event.inputs.environment }}..."
          pnpm exec prisma migrate deploy
          echo "✅ Migrations completed!"

      - name: Check migration status (after)
        run: |
          cd packages/db
          echo "📊 Updated migration status:"
          pnpm exec prisma migrate status

