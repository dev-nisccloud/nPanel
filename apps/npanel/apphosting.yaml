# Firebase App Hosting configuration
# See: https://firebase.google.com/docs/app-hosting/configure
#
# SECURITY: Do NOT put real secrets as plain "value:" in this file. Use "secret: NAME" and
# set values via: pnpm run apphosting:secrets (or firebase apphosting:secrets:set NAME)

env:
  # --- Build-only (non-sensitive) ---
  - variable: PRISMA_BINARY_TARGETS
    value: '["native", "debian-openssl-3.0.x"]'
    availability: [BUILD]
  - variable: NODE_VERSION
    value: "24.11.0"
    availability: [BUILD]
  - variable: PNPM_VERSION
    value: "10.16.1"
    availability: [BUILD]

  # --- Runtime: non-sensitive literals (safe to commit) ---
  - variable: BETTER_AUTH_ACCEPT_ANY_HTTPS
    value: "true"
  - variable: NODE_ENV
    value: "production"
  - variable: LINKEDIN_API_VERSION
    value: "202501"
  - variable: META_API_VERSION
    value: "v24.0"
  - variable: OPENPROVIDER_API_VERSION
    value: "v1beta"
  - variable: OPENPROVIDER_BASE_URL
    value: "https://api.openprovider.eu"
  - variable: OPENPROVIDER_TIMEOUT
    value: "50000"
  - variable: MPESA_ENVIRONMENT
    value: "sandbox"
  - variable: MPESA_TRANSACTION_TYPE
    value: "CustomerPayBillOnline"
  - variable: KENIC_EPP_TLS_SERVERNAME
    value: "epp.coccaregistry.org"
  - variable: KENIC_EPP_HOST
    value: "registry.kenic.or.ke"
  - variable: KENIC_EPP_PORT
    value: "700"
  - variable: KENIC_EPP_TIMEOUT_MS
    value: "30000"
  - variable: ETIMS_BASE_URL
    value: "https://sbx.kra.go.ke/etims-oscu/api/v1"
  - variable: ETIMS_TOKEN_URL
    value: "https://sbx.kra.go.ke/v1/token/generate"
  - variable: NEXT_PUBLIC_FTP_HOST
    value: "orion.nisccloud.com"
  - variable: NEXT_PUBLIC_FTP_PORT
    value: "21"
  - variable: NEXT_PUBLIC_PLESK_HOST
    value: "orion.nisccloud.com"

  # --- Runtime: secrets (set via pnpm run apphosting:secrets) ---
  - variable: BETTER_AUTH_SECRET
    secret: BETTER_AUTH_SECRET
  - variable: BETTER_AUTH_URL
    secret: BETTER_AUTH_URL
  - variable: BETTER_AUTH_URLS
    secret: BETTER_AUTH_URLS
  - variable: CORS_ORIGIN
    secret: CORS_ORIGIN
  - variable: DATABASE_URL
    secret: DATABASE_URL
  - variable: DIRECT_URL
    secret: DIRECT_URL
  - variable: GOOGLE_CLIENT_ID
    secret: GOOGLE_CLIENT_ID
