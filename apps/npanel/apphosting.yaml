    secret: GOOGLE_ADS_CLIENT_SECRET
  - variable: GOOGLE_ADS_DEVELOPER_TOKEN
    secret: GOOGLE_ADS_DEVELOPER_TOKEN
  - variable: GOOGLE_ADS_REDIRECT_URI
    secret: GOOGLE_ADS_REDIRECT_URI
  - variable: LINKEDIN_CLIENT_ID
    secret: LINKEDIN_CLIENT_ID
  - variable: LINKEDIN_CLIENT_SECRET
    secret: LINKEDIN_CLIENT_SECRET
  - variable: META_APP_ID
    secret: META_APP_ID
