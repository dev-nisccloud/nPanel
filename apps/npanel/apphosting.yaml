    availability: [RUNTIME]

# Cloud Run: 512 MiB is too low for Next.js (heap OOM). memoryMiB >= 4096 requires cpu >= 2.
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  memoryMiB: 4096
  cpu: 2
