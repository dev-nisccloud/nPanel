    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0d1b2a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="44" fill="url(#surface)"/>
  <circle cx="600" cy="360" r="250" fill="#38b6ff" opacity=".055"/>
