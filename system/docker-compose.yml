services:

  # ────────────────────────────────────────────
  #  PostgreSQL 17
  #  Accessible locally at: postgresql://localhost:5432
  # ────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: nPanel-System-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-npanel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-npanel}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - nPanel-pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-npanel} -d ${POSTGRES_DB:-npanel}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────────
  #  PgBouncer  connection pooler in front of Postgres
  #  Accessible locally at: postgresql://localhost:6432
  #  Use this URL in your app instead of direct Postgres
  # ────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: nPanel-System-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: ${POSTGRES_USER:-npanel}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-npanel}
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      SERVER_RESET_QUERY: DISCARD ALL
      # Keep these off unless debugging  noisy in logs
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
      LOG_POOLER_ERRORS: 1
      # Required for PostgreSQL 16 which defaults to scram-sha-256
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  # ────────────────────────────────────────────
  #  MinIO  S3-compatible object storage
  #  S3 API:  http://localhost:9000
  #  Console: http://localhost:9001
  # ────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: nPanel-System-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SITE_NAME: ${MINIO_SITE_NAME:-npanel-storage}
      # Expose Prometheus metrics without bearer token (internal network only)
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    volumes:
      - nPanel-miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ────────────────────────────────────────────
  #  MinIO bucket init
  #  One-shot container: creates the default bucket
  #  and sets it to public-read, then exits.
  # ────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: nPanel-System-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET:-npanel-uploads}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        mc mb --ignore-existing local/$$MINIO_DEFAULT_BUCKET;
        mc anonymous set download local/$$MINIO_DEFAULT_BUCKET;
        echo '✓ Bucket $$MINIO_DEFAULT_BUCKET ready';
      "
    restart: "no"

volumes:
  nPanel-pgdata:
    driver: local
  nPanel-miniodata:
    driver: local
