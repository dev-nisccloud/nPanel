# Paste into the Plesk domain that should serve the S3 API
# (storage.nisccloud.com, or whichever host matches MINIO_SERVER_URL).
#
# In Plesk, on that domain:
#   1. Hosting & DNS → Apache & nginx Settings
#   2. Turn Proxy mode off
#   3. Turn PHP support off
#   4. Paste the block below into Additional nginx directives
#   5. Issue a Let's Encrypt certificate for the domain in Plesk
#
# MinIO itself listens only on 127.0.0.1:9000. Do not open 9000 in the firewall.
# The console stays on 127.0.0.1:9001. Reach it with an SSH tunnel:
#   ssh -L 9001:127.0.0.1:9001 user@this-server
#   then open http://localhost:9001

client_max_body_size 1G;
proxy_ignore_client_abort on;

location / {
    proxy_pass http://127.0.0.1:9000;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    proxy_buffering         off;
    proxy_request_buffering off;
}
