global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "production"
    project: "nPanel"

# Send firing alerts to Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Load alert rule files
rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Host OS metrics (CPU, memory, disk, network)
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "nPanel-GCE-VM"

  # PostgreSQL metrics
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # MinIO S3 storage metrics
  # MinIO exposes Prometheus metrics publicly when MINIO_PROMETHEUS_AUTH_TYPE=public
  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  # Loki log storage self-metrics
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
