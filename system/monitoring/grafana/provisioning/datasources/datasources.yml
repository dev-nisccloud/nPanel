apiVersion: 1

# Remove the old Prometheus datasource that was provisioned before we dropped
# the metrics stack  Grafana's DB still references it and crashes on startup
# if we don't explicitly delete it here.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    uid: loki
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"(\w+)"'
          url: "$${__value.raw}"
