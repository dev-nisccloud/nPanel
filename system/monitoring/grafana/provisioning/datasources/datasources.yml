apiVersion: 1

datasources:

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    uid: loki
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"(\w+)"'
          url: "${__value.raw}"
