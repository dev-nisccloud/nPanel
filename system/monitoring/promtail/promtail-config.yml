server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ─────────────────────────────────────────────
  #  Docker container log discovery
  #  Automatically picks up all running containers.
  #  Labels: container name, service name, compose project.
  # ─────────────────────────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          # Only tail nPanel-System-* containers
          - name: name
            values: ["nPanel-System-*"]

    relabel_configs:
      # Use the container name as the "container" label
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container

      # Expose the Docker Compose service name
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service

      # Log stream (stdout / stderr)
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream

      # Tag with the compose project name
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project

    pipeline_stages:
      # Parse JSON log lines if the container emits JSON (Hono/Bun does)
      - json:
          expressions:
            level: level
            msg: msg
            time: time
          # If parsing fails (plain text logs), silently skip
      # Add a severity label for filtering in Grafana
      - labels:
          level:
      # Drop debug logs in production to reduce storage
      - match:
          selector: '{level="debug"}'
          action: drop
