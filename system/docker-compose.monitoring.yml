# Observability + Backup stack — run alongside the base file:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Services:
#   loki        → log storage                           → http://localhost:3101
#   promtail    → Docker log collector → Loki
#   grafana     → log browser (Loki datasource only)   → http://localhost:3100
#   uptime-kuma → uptime checks + status page          → http://localhost:3102
#   pg-backup   → scheduled pg_dump with retention
#   pgadmin     → PostgreSQL web GUI                   → http://localhost:5050
#
# What was intentionally left out (add back when you need metrics dashboards):
#   prometheus      — 200–500 MB RAM + 2–5 GB disk (30d TSDB). Heavy for a single VM.
#   node-exporter   — only useful when prometheus is running
#   postgres-exporter — only useful when prometheus is running
#   alertmanager    — only useful when prometheus is running
#   Uptime Kuma handles downtime alerts. Add the Prometheus stack later via a
#   separate docker-compose.metrics.yml when you actually need time-series dashboards.

services:

  # ────────────────────────────────────────────
  #  Loki  log aggregation and storage
  #  Paired with Promtail (collector) and Grafana (viewer)
  # ────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: nPanel-System-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - nPanel-loki-data:/loki
    ports:
      - "3101:3100"

  # ────────────────────────────────────────────
  #  Promtail  Docker log collector → Loki
  #  Automatically tails all nPanel-System-* container logs
  # ────────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: nPanel-System-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # ────────────────────────────────────────────
  #  Grafana  log browser (Loki datasource)
  #  UI: http://localhost:3100
  #  Login: GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD
  #
  #  Running with Loki only — no Prometheus datasource.
  #  When you add docker-compose.metrics.yml later, Grafana will
  #  automatically pick up the Prometheus datasource from provisioning.
  # ────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: nPanel-System-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3100}
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
    volumes:
      - nPanel-grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3100:3000"
    depends_on:
      - loki

  # ────────────────────────────────────────────
  #  Uptime Kuma  uptime checks + status page
  #  UI: http://localhost:3102
  #  Configure monitors via the web UI on first run.
  #  Handles downtime alerting (email/Slack/webhook) without needing Alertmanager.
  # ────────────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: nPanel-System-uptime-kuma
    restart: unless-stopped
    volumes:
      - nPanel-uptime-kuma-data:/app/data
    ports:
      - "3102:3001"

  # ────────────────────────────────────────────
  #  pg-backup  scheduled daily pg_dump with retention
  #  Backups land in the nPanel-pg-backups volume as .sql.gz files.
  #  Restore: gunzip -c backup.sql.gz | psql -h localhost -U npanel npanel
  # ────────────────────────────────────────────
  pg-backup:
    image: postgres:17-alpine
    container_name: nPanel-System-pg-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-npanel}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-npanel}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
    volumes:
      - nPanel-pg-backups:/backups
      - ./backup/backup.sh:/backup.sh:ro
    entrypoint: >
      /bin/sh -c "
        chmod +x /backup.sh;
        echo \"$$BACKUP_CRON /backup.sh >> /var/log/backup.log 2>&1\" | crontab -;
        crond -f -l 2
      "
    depends_on:
      postgres:
        condition: service_healthy

  # ────────────────────────────────────────────
  #  pgAdmin  PostgreSQL web GUI
  #  UI (local): http://localhost:5050
  #  UI (prod):  https://db-admin.nisccloud.com
  #  Login: PGADMIN_EMAIL / PGADMIN_PASSWORD
  #
  #  IMPORTANT: PGADMIN_DEFAULT_* vars are init-only.
  #  They are read once when the volume is empty.
  #  To reset: docker volume rm nPanel-pgadmin-data && restart.
  #  The nPanel Postgres server is pre-registered via servers.json.
  # ────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nPanel-System-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@nisccloud.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD is required}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: '"nPanel Database Admin"'
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - nPanel-pgadmin-data:/var/lib/pgadmin
      - ./monitoring/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  nPanel-loki-data:
    driver: local
  nPanel-grafana-data:
    driver: local
  nPanel-uptime-kuma-data:
    driver: local
  nPanel-pg-backups:
    driver: local
  nPanel-pgadmin-data:
    driver: local
