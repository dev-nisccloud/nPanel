# Observability + Backup stack  run alongside the base file:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Services added:
#   prometheus      → metrics scraping + storage     → http://localhost:9090
#   grafana         → dashboards + alerting UI       → http://localhost:3100
#   loki            → log aggregation + storage      → http://localhost:3101
#   promtail        → Docker log collector → Loki
#   node-exporter   → host CPU / memory / disk metrics
#   postgres-exporter → PostgreSQL metrics
#   alertmanager    → alert routing (email / Slack / webhook)
#   uptime-kuma     → uptime checks + status page    → http://localhost:3102
#   pg-backup       → scheduled pg_dump with retention

services:

  # ────────────────────────────────────────────
  #  Prometheus  metrics scraper + time-series DB
  #  UI: http://localhost:9090
  # ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: nPanel-System-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - nPanel-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager

  # ────────────────────────────────────────────
  #  Grafana  dashboards, datasources, alerting
  #  UI: http://localhost:3100
  #  Default login: GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD
  # ────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: nPanel-System-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3100}
      GF_FEATURE_TOGGLES_ENABLE: "alertingSimplifiedRouting"
      # Persist alert state across restarts
      GF_ALERTING_ENABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "true"
    volumes:
      - nPanel-grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3100:3000"
    depends_on:
      - prometheus
      - loki

  # ────────────────────────────────────────────
  #  Loki  log aggregation and storage
  #  Paired with Promtail (collector) and Grafana (viewer)
  # ────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: nPanel-System-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - nPanel-loki-data:/loki
    ports:
      - "3101:3100"

  # ────────────────────────────────────────────
  #  Promtail  Docker log collector → Loki
  #  Automatically tails all nPanel-System-* container logs
  # ────────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: nPanel-System-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # ────────────────────────────────────────────
  #  Node Exporter  host OS metrics (CPU, RAM, disk, network)
  #  NOTE: on Linux/GCE this exposes real host metrics.
  #        on Docker Desktop (Windows/Mac) it shows the VM metrics.
  # ────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: nPanel-System-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"

  # ────────────────────────────────────────────
  #  Postgres Exporter  PostgreSQL metrics → Prometheus
  # ────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: nPanel-System-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-npanel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-npanel}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  # ────────────────────────────────────────────
  #  Alertmanager  routes alerts to email / Slack / webhook
  #  UI: http://localhost:9093
  # ────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: nPanel-System-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - nPanel-alertmanager-data:/alertmanager
    ports:
      - "9093:9093"

  # ────────────────────────────────────────────
  #  Uptime Kuma  external health checks + status page
  #  UI: http://localhost:3102
  #  Set up monitors manually via the web UI on first run.
  # ────────────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: nPanel-System-uptime-kuma
    restart: unless-stopped
    volumes:
      - nPanel-uptime-kuma-data:/app/data
    ports:
      - "3102:3001"

  # ────────────────────────────────────────────
  #  pg-backup  scheduled daily pg_dump with retention
  #  Backups land in the nPanel-pg-backups volume as .sql.gz files.
  #  Restore: gunzip -c backup.sql.gz | psql -h localhost -U npanel npanel
  # ────────────────────────────────────────────
  pg-backup:
    image: postgres:16-alpine
    container_name: nPanel-System-pg-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-npanel}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-npanel}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      # Cron schedule  default: 2:00 AM every day
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
    volumes:
      - nPanel-pg-backups:/backups
      - ./backup/backup.sh:/backup.sh:ro
    entrypoint: >
      /bin/sh -c "
        chmod +x /backup.sh;
        echo \"$$BACKUP_CRON /backup.sh >> /var/log/backup.log 2>&1\" | crontab -;
        crond -f -l 2
      "
    depends_on:
      postgres:
        condition: service_healthy

  # ────────────────────────────────────────────
  #  pgAdmin  PostgreSQL web GUI
  #  UI (local): http://localhost:5050
  #  UI (prod):  https://db-admin.nisccloud.com
  #  Login: PGADMIN_EMAIL / PGADMIN_PASSWORD
  # ────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nPanel-System-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@nisccloud.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: '"nPanel Database Admin"'
    volumes:
      - nPanel-pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"

volumes:
  nPanel-prometheus-data:
    driver: local
  nPanel-grafana-data:
    driver: local
  nPanel-loki-data:
    driver: local
  nPanel-alertmanager-data:
    driver: local
  nPanel-uptime-kuma-data:
    driver: local
  nPanel-pg-backups:
    driver: local
  nPanel-pgadmin-data:
    driver: local
