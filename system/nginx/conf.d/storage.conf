# ─────────────────────────────────────────────────────────────
#  HTTP → HTTPS redirect + Certbot ACME challenge
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name storage.nisccloud.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────
#  MinIO S3 API  →  https://storage.nisccloud.com
#
#  This domain is required so that presigned upload/download
#  URLs contain a proper hostname instead of an internal IP.
#
#  MinIO Console is accessed directly via:  http://<VM-IP>:9001
# ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name storage.nisccloud.com;

    ssl_certificate     /etc/letsencrypt/live/storage.nisccloud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storage.nisccloud.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Required for large file uploads (up to 1GB)
    client_max_body_size 1G;

    proxy_ignore_client_abort on;

    location / {
        proxy_pass http://minio:9000;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for S3 multipart uploads
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering         off;
        proxy_request_buffering off;
    }
}
