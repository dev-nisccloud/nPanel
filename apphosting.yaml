# Firebase App Hosting configuration
# See: https://firebase.google.com/docs/app-hosting/configure
#
# SECURITY: Do NOT put real secrets (DATABASE_URL, API keys, etc.) as plain "value:" in this file.
# This file is committed to git. For secrets, use "secret: SECRET_NAME" and store the actual
# value in Firebase/Cloud Secret Manager: firebase apphosting:secrets:set SECRET_NAME

env:
  # Safe to commit: platform identifiers only, not sensitive.
  - variable: PRISMA_BINARY_TARGETS
    value: '["native", "debian-openssl-3.0.x"]'
    availability: [BUILD]

  # Required at RUNTIME — create secrets first: pnpm run apphosting:secrets (or firebase apphosting:secrets:set NAME)
  - variable: DATABASE_URL
    secret: DATABASE_URL
  - variable: DIRECT_URL
    secret: DIRECT_URL
  - variable: BETTER_AUTH_SECRET
    secret: BETTER_AUTH_SECRET
  # App URL used for auth callbacks, worker endpoints (QSTASH_*), etc. Set to your backend URL, e.g. https://xxx---nisccloud-npanel-xxx.a.run.app
  - variable: NEXT_PUBLIC_APP_URL
    secret: NEXT_PUBLIC_APP_URL
  # Cap Node heap to avoid OOM; 460 fits 512 MiB, 3584 fits 4096 MiB.
  - variable: NODE_OPTIONS
    value: "--max-old-space-size=460"
    availability: [RUNTIME]

# Cloud Run: 512 MiB default causes heap OOM. memoryMiB >= 4096 requires cpu >= 2.
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  memoryMiB: 4096
  cpu: 2
